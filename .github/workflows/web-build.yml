name: Web build check

on:
  push:
    branches:
      - google-ai-studio
  pull_request:
    branches:
      - google-ai-studio
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Google AI Studio web edition
        run: npm run build
      - name: Verify production entry point
        run: test -s dist/index.html
